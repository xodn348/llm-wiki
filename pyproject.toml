[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-maintained wiki of paradigm-shifting scientific papers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Junhyuk Lee" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "chromadb>=0.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tqdm>=4.66",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "pageindex>=0.2.8",
    "umap-learn>=0.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "markdownify>=0.13",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLW0603", "PLC0415", "BLE001", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
