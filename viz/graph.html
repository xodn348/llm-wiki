m Ornstein and Davis's polyacrylamide gel system."}}, {"data": {"id": "e24", "source": "10.1038/ng.806", "target": "10.1093/bioinformatics/btp324", "type": "cite", "label": "The GATK variant-calling framework uses BWA as a short-read alignment method for mapping sequencing reads before variant discovery."}}, {"data": {"id": "e25", "source": "10.1038/ng.806", "target": "10.1093/bioinformatics/btp352", "type": "cite", "label": "The GATK framework builds on SAM/BAM and SAMtools conventions for storing, manipulating, and preprocessing aligned next-generation sequencing reads."}}, {"data": {"id": "e26", "source": "10.1038/ng.806", "target": "10.1186/gb-2009-10-3-r25", "type": "cite", "label": "The GATK framework cites Bowtie as an alternative ultrafast short-read aligner for mapping reads to the human genome before genotyping."}}, {"data": {"id": "e27", "source": "10.1038/ng.806", "target": "10.1038/nature09534", "type": "cite", "label": "The GATK paper uses the 1000 Genomes pilot map as population-scale evidence and benchmark data for human variant discovery."}}, {"data": {"id": "e28", "source": "10.2307/2666999", "target": "10.1037//0022-3514.51.6.1173", "type": "cite", "label": "Edmondson's team-learning model uses Baron and Kenny's moderator-mediator distinction to test whether psychological safety mediates or moderates learning behavior."}}, {"data": {"id": "e29", "source": "10.2307/2666999", "target": "10.1037/0003-066x.37.2.122", "type": "cite", "label": "Psychological safety is linked to Bandura's self-efficacy theory through the claim that beliefs about interpersonal risk shape whether people act and learn."}}, {"data": {"id": "e30", "source": "10.2307/2666999", "target": "10.1037/h0046016", "type": "cite", "label": "Edmondson uses the multitrait-multimethod matrix logic to support convergent and discriminant validation of psychological safety and team-learning measures."}}, {"data": {"id": "e31", "source": "10.2307/2666999", "target": "10.2307/40183951", "type" cation choices to implicit prices for bundled amenities."}}, {"data": {"id": "e1355", "source": "10.1056/nejmoa0708857", "target": "10.1056/nejmoa1915745", "type": "enables", "label": "Sorafenib established a systemic-therapy survival benchmark in advanced hepatocellular carcinoma that atezolizumab plus bevacizumab was tested against."}}, {"data": {"id": "e1356", "source": "10.1080/01621459.1979.10482531", "target": "10.1016/0304-4076(92)90104-y", "type": "enables", "label": "Dickey and Fuller's unit-root asymptotics enabled KPSS by defining the complementary nonstationarity alternative against which stationarity is tested."}}, {"data": {"id": "e1357", "source": "10.2307/1913610", "target": "10.1016/0304-4076(92)90104-y", "type": "enables", "label": "Newey-West HAC covariance estimation enabled KPSS by providing robust long-run variance estimation under heteroskedasticity and autocorrelation."}}, {"data": {"id": "e1358", "source": "10.2307/2086579", "target": "10.1086/467037", "type": "enables", "label": "Weber's theory of bureaucracy and authority enabled Fama and Jensen's ownership-control analysis by framing organizations as systems of delegated decision rights."}}, {"data": {"id": "e1359", "source": "10.1016/0304-405x(76)90026-x", "target": "10.1086/467037", "type": "enables", "label": "Jensen and Meckling's agency-cost theory enabled Fama and Jensen's explanation of ownership-control separation as a governance response to residual risk and decision control problems."}}, {"data": {"id": "e1360", "source": "10.1111/j.1540-6261.1964.tb02865.x", "target": "10.1086/260061", "type": "enables", "label": "Sharpe's CAPM equilibrium relation between systematic risk beta and expected return enabled Fama and MacBeth to test that risk-return pricing claim empirically."}}, {"data": {"id": "e1361", "source": "10.1001/archpsyc.1961.01710120031004", "target": "10.1177/014662167700100306", "type": "enables", "label": "Beck's Depression Inventory supplied a symptom-based self-report model for quantifying depressive affect that informed the CES-D's population screening items."}}, {"data": {"id": "e1362", "source": "10.1136/jnnp.23.1.56", "target": "10.1177/014662167700100306", "type": "enables", "label": "Hamilton's clinician-rated depression scale established standardized depressive symptom measurement that the CES-D adapted into a community self-report format."}}, {"data": {"id": "e1363", "source": "10.1073/pnas.74.12.5463", "target": "10.1126/science.2448875", "type": "enables", "label": "Sanger chain-termination sequencing made primer-directed DNA synthesis and sequence verification routine, supporting PCR assay design and validation."}}, {"data": {"id": "e1364", "source": "10.1056/nejmoa1003466", "target": "10.1056/nejmoa1503093", "type": "enables", "label": "The ipilimumab melanoma trial established CTLA-4 checkpoint blockade as a survival-improving comparator, enabling pembrolizumab to be tested against it."}}, {"data": {"id": "e1365", "source": "10.1038/nature04226", "target": "10.1038/nature09534", "type": "enables", "label": "The HapMap catalog of common haplotypes and SNP linkage structure provided the reference framework that 1000 Genomes extended with sequencing-based variant discovery."}}, {"data": {"id": "e1366", "source": "10.1111/j.2517-6161.1977.tb01600.x", "target": "10.1038/44565", "type": "enables", "label": "The EM algorithm provided an iterative likelihood-optimization template for latent-variable models that helped motivate multiplicative update approaches for matrix factorization."}}, {"data": {"id": "e1367", "source": "10.1162/jocn.1991.3.1.71", "target": "10.1038/44565", "type": "enables", "label": "Eigenfaces showed that faces and images could be represented by low-dimensional basis decompositions, which NMF recast as additive nonnegative parts."}}, {"data": {"id": "e1368", "source": "10.1023/b:visi.0000029664.99615.94", "target": "10.1109/tro.2015.2463671", "type": "enables", "label": "SIFT popularized robust local keypoint detection and descriptor matching, the feature-tracking paradigm that ORB-SLAM implements with faster ORB features."}}, {"data": {"id": "e1369", "source": "10.5281/zenodo.14579729", "target": "10.1509/jmkg.68.1.1.24036", "type": "enables", "label": "SERVQUAL's focus on perceived service quality helped frame marketing value as service-centered and customer-experiential in service-dominant logic."}}, {"data": {"id": "e1370", "source": "10.2307/2232409", "target": "10.1509/jmkg.68.1.1.24036", "type": "enables", "label": "Nelson and Winter's evolutionary view of routines and dynamic change supported service-dominant logic's claim that markets evolve through operant resources and capabilities."}}, {"data": {"id": "e1371", "source": "10.1016/0749-5978(91)90020-t", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "The theory of planned behavior contributed individual intention and behavioral control constructs that CFIR incorporated into its implementation-behavior domain."}}, {"data": {"id": "e1372", "source": "10.1037//0033-295x.84.2.191", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy concept supplied the belief-in-capability construct that CFIR uses to explain whether individuals adopt implementation practices."}}, {"data": {"id": "e1373", "source": "10.1016/0146-6402(78)90002-4", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy theory supplied the capability-belief mechanism that CFIR treats as a determinant of implementation behavior."}}, {"data": {"id": "e1374", "source": "10.1037/0033-295x.84.2.191", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy concept supplied the belief-in-capability construct that CFIR uses to explain whether individuals adopt implementation practices."}}, {"data": {"id": "e1375", "source": "10.1073/pnas.0502848102", "target": "10.1103/physrevlett.105.136805", "type": "enables", "label": "The isolation of stable two-dimensional crystals established exfoliated atomically thin materials as experimentally accessible, enabling monolayer MoS2 optical and band-gap studies."}}, {"data": {"id": "e1376", "source": "10.1175/1520-0469(1963)020<0130:dnf>2.0.co;2", "target": "10.1098/rspa.1998.0193", "type": "enables", "label": "Lorenz's deterministic chaos highlighted nonlinear, nonstationary dynamics, motivating adaptive time-frequency tools such as empirical mode decomposition and the Hilbert spectrum."}}, {"data": {"id": "e1377", "source": "10.5244/c.2.23", "target": "10.1023/b:visi.0000029664.99615.94", "type": "enables", "label": "The Harris corner detector introduced repeatable local interest-point detection, a precursor to SIFT's scale-space keypoint localization."}}, {"data": {"id": "e1378", "source": "10.1109/iccv.1999.790410", "target": "10.1023/b:visi.0000029664.99615.94", "type": "enables", "label": "Lowe's 1999 local scale-invariant feature method introduced the object-recognition pipeline that his 2004 SIFT paper formalized and refined."}}, {"data": {"id": "e1379", "source": "10.1037/h0043158", "target": "10.1016/0022-2496(77)90033-5", "type": "enables", "label": "Miller's limit on simultaneous human judgments motivated Saaty's hierarchical pairwise-comparison method for scaling priorities within manageable cognitive chunks."}}, {"data": {"id": "e1380", "source": "10.1126/science.282.5391.1145", "target": "10.1016/j.cell.2006.07.024", "type": "enables", "label": "Human embryonic stem cell pluripotency provided the benchmark concept that Yamanaka\u2019s defined-factor reprogramming sought to recreate in induced pluripotent stem cells."}}, {"data": {"id": "e1381", "source": "10.1002/ett.4460100604", "target": "10.1109/tit.2004.838089", "type": "enables", "label": "The MIMO capacity result established spatial diversity as an information-theoretic resource, which cooperative diversity adapted to distributed single-antenna wireless nodes."}}, {"data": {"id": "e1382", "source": "10.2307/1912775", "target": "10.2307/2297968", "type": "enables", "label": "Hansen\u2019s GMM asymptotics enabled Arellano and Bond\u2019s panel-data specification tests using moment conditions for dynamic employment equations."}}, {"data": {"id": "e1383", "source": "10.2307/1913827", "target": "10.2307/2297968", "type": "enables", "label": "Hausman\u2019s specification-test logic underlies Arellano and Bond\u2019s use of diagnostic tests to detect invalid panel-data estimators and instruments."}}, {"data": {"id": "e1384", "source": "10.1214/aos/1176344552", "target": "10.1111/j.1558-5646.1985.tb00420.x", "type": "enables", "label": "Efron\u2019s bootstrap resampling method enabled Felsenstein to assign confidence limits to phylogenetic tree branches by resampling characters."}}, {"data": {"id": "e1385", "source": "10.1086/307221", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "High-redshift Type Ia supernova constraints on \u03a9 and \u039b supplied the late-universe acceleration evidence later combined with Planck CMB parameter estimates."}}, {"data": {"id": "e1386", "source": "10.1086/148307", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "Penzias and Wilson\u2019s excess antenna temperature measurement discovered the cosmic microwave background that Planck later mapped precisely for cosmological parameters."}}, {"data": {"id": "e1387", "source": "10.1086/300499", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "Supernova evidence for an accelerating universe established the cosmological-constant component that Planck quantified within \u039bCDM."}}, {"data": {"id": "e1388", "source": "10.1086/377226", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "WMAP\u2019s first-year CMB parameter estimation established the precision-CMB \u039bCDM framework that Planck refined with higher-resolution data."}}, {"data": {"id": "e1389", "source": "10.1103/physrevd.23.347", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "Guth\u2019s inflationary horizon-and-flatness solution supplied the early-universe model whose perturbation predictions Planck tested through CMB parameters."}}, {"data": {"id": "e1390", "source": "10.1214/ss/1177011136", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "Gelman and Rubin\u2019s multiple-chain convergence diagnostic supported the MCMC parameter-inference workflows used in Planck cosmological analysis."}}, {"data": {"id": "e1391", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/tpami.2016.2572683", "type": "enables", "label": "LeCun\u2019s convolutional backpropagation for handwritten recognition established trainable convolutional feature hierarchies that fully convolutional networks extended to dense semantic segmentation."}}, {"data": {"id": "e1392", "source": "10.1038/353737a0", "target": "10.1126/science.1243167", "type": "enables", "label": "Dye-sensitized TiO2 solar cells established mesoscopic solution-processed photovoltaic architectures that informed later perovskite transport-length studies."}}, {"data": {"id": "e1393", "source": "10.1177/001316446002000104", "target": "10.2307/2529310", "type": "enables", "label": "Cohen\u2019s kappa introduced chance-corrected agreement for nominal categories, which Landis and Koch generalized and interpreted for categorical observer data."}}, {"data": {"id": "e1394", "source": "10.1113/jphysiol.1962.sp006837", "target": "10.1162/neco.1989.1.4.541", "type": "enables", "label": "Hubel and Wiesel\u2019s visual-cortex receptive fields inspired the local-feature and hierarchical-vision assumptions used in convolutional neural networks for zip-code recognition."}}, {"data": {"id": "e1395", "source": "10.1109/tit.1976.1055638", "target": "10.1145/357980.358017", "type": "enables", "label": "Diffie and Hellman\u2019s public-key cryptography concept enabled RSA\u2019s concrete digital-signature and public-key encryption construction."}}, {"data": {"id": "e1396", "source": "10.2307/429816", "target": "10.1287/orsc.5.1.14", "type": "enables", "label": "Gibson\u2019s affordance-based view of perception informed Nonaka\u2019s treatment of knowledge as context-dependent interaction between agents and environment."}}, {"data": {"id": "e1397", "source": "10.1103/physrevlett.14.57", "target": "10.1007/bf02345020", "type": "enables", "label": "Penrose\u2019s singularity theorem made gravitational collapse to black holes mathematically unavoidable, setting the spacetime background for Hawking\u2019s particle-creation calculation."}}, {"data": {"id": "e1398", "source": "10.1038/nbt.1621", "target": "10.1126/science.1260419", "type": "enables", "label": "Cufflinks-style RNA-Seq transcript assembly and isoform quantification enabled transcript-level expression references used to connect tissues with the human proteome map."}}, {"data": {"id": "e1399", "source": "10.1126/science.220.4598.671", "target": "10.1109/4235.585893", "type": "enables", "label": "Simulated annealing exemplified a general-purpose optimization heuristic, which the no-free-lunch theorems later bounded by showing no optimizer is universally superior."}}, {"data": {"id": "e1400", "source": "10.1109/5.726791", "target": "10.1162/neco.2006.18.7.1527", "type": "enables", "label": "LeCun et al. showed that multilayer neural networks could learn useful hierarchical representations from data, enabling Hinton et al.'s later layer-wise training approach for deep belief networks."}}, {"data": {"id": "e1401", "source": "10.1103/physrev.47.777", "target": "10.1103/physrevlett.70.1895", "type": "enables", "label": "Einstein, Podolsky, and Rosen introduced entanglement as a challenge to quantum completeness, enabling Bennett et al.'s teleportation protocol that uses shared EPR entanglement plus classical communication."}}, {"data": {"id": "e1402", "source": "10.1111/j.1749-6632.1964.tb14213.x", "target": "10.1016/s0021-9258(18)94333-4", "type": "enables", "label": "Ornstein and Davis's disc polyacrylamide electrophoresis method enabled SDS-PAGE molecular-weight calibration by providing the gel separation framework used to analyze serum and protein mobility."}}, {"data": {"id": "e1403", "source": "10.1103/physrevb.33.8822", "target": "10.1103/physrevb.46.6671", "type": "enables", "label": "Perdew's 1986 correlation functional supplied a gradient-corrected correlation term that fed directly into the 1992 generalized gradient approximation for exchange and correlation."}}, {"data": {"id": "e1404", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevb.46.6671", "type": "enables", "label": "Kohn and Sham's self-consistent density-functional equations provided the computational framework in which the 1992 generalized gradient approximation was applied to atoms, molecules, solids, and surfaces."}}, {"data": {"id": "e1405", "source": "10.1126/science.220.4598.671", "target": "10.1109/3477.484436", "type": "enables", "label": "Simulated annealing established probabilistic search for combinatorial optimization, enabling ant colony optimization to frame collective path construction as another stochastic metaheuristic."}}, {"data": {"id": "e1406", "source": "10.1038/35021093", "target": "10.1038/nature10983", "type": "enables", "label": "Molecular portraits introduced expression-based breast cancer subtypes, enabling METABRIC's larger genomic-transcriptomic analysis to refine and expand those molecular subgroup definitions."}}, {"data": {"id": "e1407", "source": "10.1073/pnas.191367098", "target": "10.1038/nature10983", "type": "enables", "label": "Sorlie et al. linked breast carcinoma expression subclasses to clinical outcomes, enabling METABRIC to integrate transcriptomic subtypes with genomic architecture and prognosis at larger scale."}}, {"data": {"id": "e1408", "source": "10.2307/2530946", "target": "10.1023/a:1018054314350", "type": "enables", "label": "CART provided unstable decision-tree predictors whose variance could be reduced by Breiman's bootstrap aggregation method in Bagging Predictors."}}, {"data": {"id": "e1409", "source": "10.2307/1884852", "target": "10.1287/orsc.2.1.71", "type": "enables", "label": "Simon's bounded rationality and satisficing model enabled March's organizational learning theory to formalize the tradeoff between exploration and exploitation under limited rationality."}}, {"data": {"id": "e1410", "source": "10.1111/j.2517-6161.1977.tb01600.x", "target": "10.1016/0197-2456(86)90046-2", "type": "enables", "label": "The EM algorithm provided a likelihood-based way to estimate parameters with incomplete data, enabling meta-analysis methods to combine partially observed clinical-trial evidence."}}, {"data": {"id": "e1411", "source": "10.1016/0021-9991(77)90098-5", "target": "10.1103/physrevlett.55.2471", "type": "enables", "label": "Ryckaert, Ciccotti, and Berendsen's constrained molecular-dynamics integration method enabled Car and Parrinello to combine atomic motion with electronic-structure calculations in unified molecular dynamics."}}, {"data": {"id": "e1412", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevlett.55.2471", "type": "enables", "label": "Kohn-Sham density-functional theory supplied the self-consistent electronic energy framework that Car and Parrinello embedded into molecular dynamics."}}, {"data": {"id": "e1413", "source": "10.1109/tsmc.1973.4309314", "target": "10.1148/radiol.2015151169", "type": "enables", "label": "Haralick's texture features showed that quantitative image patterns can be extracted as data, enabling radiomics to treat medical images as mineable feature sets."}}, {"data": {"id": "e1414", "source": "10.2307/2089062", "target": "10.1086/225469", "type": "enables", "label": "Heider's theory of interpersonal relations supplied concepts about social ties and balance that enabled Granovetter's claim that weak ties bridge otherwise separated social clusters."}}, {"data": {"id": "e1415", "source": "10.1056/nejm199309303291401", "target": "10.1016/s0140-6736(98)07019-6", "type": "enables", "label": "The DCCT showed that intensive glucose control reduces diabetic complications in type 1 diabetes, enabling UKPDS 33 to test the same clinical claim in type 2 diabetes."}}, {"data": {"id": "e1416", "source": "10.1093/nar/28.1.235", "target": "10.1038/sdata.2016.18", "type": "enables", "label": "The Protein Data Bank exemplified persistent, reusable biological data infrastructure, enabling the FAIR Principles' later formalization of findable, accessible, interoperable, and reusable scientific data."}}, {"data": {"id": "e1417", "source": "10.1016/0893-6080(89)90020-8", "target": "10.1016/j.jcp.2018.10.045", "type": "enables", "label": "Universal approximation theory justified neural networks as flexible function approximators, enabling physics-informed neural networks to represent PDE solutions and inverse mappings."}}, {"data": {"id": "e1418", "source": "10.1038/35021093", "target": "10.1038/nature11412", "type": "enables", "label": "Molecular portraits established intrinsic breast cancer subtypes from gene expression, enabling TCGA's comprehensive molecular portraits to integrate expression, mutation, copy-number, methylation, and protein data."}}, {"data": {"id": "e1419", "source": "10.1126/science.3798106", "target": "10.1038/nature11412", "type": "enables", "label": "The HER2/neu amplification study identified a clinically important breast cancer driver, enabling TCGA's comprehensive portrait to place HER2-enriched tumors within a broader molecular taxonomy."}}, {"data": {"id": "e1420", "source": "10.1093/nar/7.6.1513", "target": "10.1128/jb.173.2.697-703.1991", "type": "enables", "label": "Alkaline lysis enabled rapid plasmid DNA screening, supporting recombinant DNA workflows used before PCR-based 16S rDNA phylogenetic amplification."}}, {"data": {"id": "e1421", "source": "10.1063/1.447334", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "Constant-temperature molecular dynamics supplied thermostat methods later used with first-principles electronic-structure simulations such as PAW-based molecular dynamics."}}, {"data": {"id": "e1422", "source": "10.1103/physrevlett.45.566", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "Stochastic electron-gas calculations informed exchange-correlation modeling, a density-functional ingredient required by the PAW method."}}, {"data": {"id": "e1423", "source": "10.1103/physrevlett.55.2471", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "Car-Parrinello molecular dynamics unified ionic motion with density-functional electronic structure, directly motivating PAW implementations for ab initio simulations."}}, {"data": {"id": "e1424", "source": "10.1016/0021-9991(77)90098-5", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "SHAKE-style constrained dynamics enabled stable molecular dynamics integration methods later combined with PAW electronic-structure force calculations."}}, {"data": {"id": "e1425", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "The Kohn-Sham self-consistent equations are the density-functional framework in which the projector augmented-wave method is formulated."}}, {"data": {"id": "e1426", "source": "10.1007/s11263-009-0275-4", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "PASCAL VOC provided object-recognition benchmarks used to evaluate visual representations learned by methods such as Momentum Contrast."}}, {"data": {"id": "e1427", "source": "10.1109/cvpr.2014.81", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "R-CNN popularized transfer evaluation for learned visual features, a protocol used to assess Momentum Contrast representations."}}, {"data": {"id": "e1428", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "ImageNet supplied the large-scale image corpus used to train and benchmark self-supervised visual encoders such as Momentum Contrast."}}, {"data": {"id": "e1429", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "Backpropagation for convolutional networks established the gradient-based representation learning machinery used by Momentum Contrast encoders."}}, {"data": {"id": "e1430", "source": "10.1371/journal.pcbi.1002195", "target": "10.1038/s41586-021-03819-2", "type": "enables", "label": "Accelerated profile HMM searches enabled fast multiple-sequence-alignment discovery, a core input source for AlphaFold's protein-structure predictions."}}, {"data": {"id": "e1431", "source": "10.1109/cvpr.2016.90", "target": "10.1038/s41586-021-03819-2", "type": "enables", "label": "Residual connections enabled very deep neural networks, an architectural principle used in AlphaFold's deep protein-structure model."}}, {"data": {"id": "e1432", "source": "10.1037/h0040957", "target": "10.1037/0003-066x.32.7.513", "type": "enables", "label": "Construct validity framed how psychological concepts should be operationalized, supporting Bronfenbrenner's call for ecologically valid developmental research."}}, {"data": {"id": "e1433", "source": "10.1177/0003603x8603100308", "target": "10.1177/002224299405800302", "type": "enables", "label": "Transaction-cost institutional theory supplied the governance and exchange-efficiency concepts underlying commitment and trust in relationship marketing."}}, {"data": {"id": "e1434", "source": "10.1006/jcss.1997.1504", "target": "10.1023/b:visi.0000013087.49260.fb", "type": "enables", "label": "AdaBoost provided the learning algorithm used by the Viola-Jones face detector to combine weak Haar-feature classifiers."}}, {"data": {"id": "e1435", "source": "10.1109/34.730558", "target": "10.1023/b:visi.0000013087.49260.fb", "type": "enables", "label": "Saliency-based attention supplied the selective visual-processing idea echoed by cascade-style focus on promising image regions in real-time face detection."}}, {"data": {"id": "e1436", "source": "10.1023/a:1022643204877", "target": "10.1023/b:visi.0000013087.49260.fb", "type": "enables", "label": "Decision-tree induction provided the weak-classifier structure that AdaBoost could combine in the Viola-Jones detection cascade."}}, {"data": {"id": "e1437", "source": "10.2307/1796430", "target": "10.1038/35002501", "type": "enables", "label": "Island biogeography linked species richness to area and isolation, a theoretical basis for prioritizing biodiversity hotspots by endemism and habitat loss."}}, {"data": {"id": "e1438", "source": "10.1093/genetics/155.2.945", "target": "10.1086/519795", "type": "enables", "label": "STRUCTURE-style population stratification inference motivated PLINK's tools for controlling ancestry effects in genome-wide association studies."}}, {"data": {"id": "e1439", "source": "10.1111/j.2517-6161.1995.tb02031.x", "target": "10.1086/519795", "type": "enables", "label": "False-discovery-rate control supplied the multiple-testing correction logic needed for interpreting PLINK's genome-wide association p-values."}}, {"data": {"id": "e1440", "source": "10.1111/j.1469-1809.1936.tb02137.x", "target": "10.1109/mhs.1995.494215", "type": "enables", "label": "Fisher's discriminant analysis introduced combining multiple measured variables into an optimization criterion, enabling particle swarm optimization's treatment of candidate solutions as points in a multivariate search space."}}, {"data": {"id": "e1441", "source": "10.1038/227680a0", "target": "10.1073/pnas.76.9.4350", "type": "enables", "label": "Laemmli's SDS-PAGE separation of bacteriophage T4 proteins enabled Towbin's Western blot by providing the gel-resolved proteins that could be transferred to nitrocellulose."}}, {"data": {"id": "e1442", "source": "10.1111/j.2517-6161.1964.tb00553.x", "target": "10.1080/01621459.1999.10474144", "type": "enables", "label": "Box-Cox transformation theory enabled Fine and Gray's competing-risk regression by formalizing how transformed outcome scales can make regression models tractable."}}, {"data": {"id": "e1443", "source": "10.1111/j.2517-6161.1972.tb00899.x", "target": "10.1080/01621459.1999.10474144", "type": "enables", "label": "Cox's proportional hazards model supplied the hazard-regression framework that Fine and Gray adapted to the subdistribution hazard for competing risks."}}, {"data": {"id": "e1444", "source": "10.1103/physreva.38.3098", "target": "10.1103/physrevlett.77.3865", "type": "enables", "label": "Becke's 1988 gradient-corrected exchange functional enabled PBE by showing how density gradients could improve exchange while preserving correct asymptotic behavior."}}, {"data": {"id": "e1445", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevlett.77.3865", "type": "enables", "label": "Kohn-Sham density functional theory supplied the self-consistent exchange-correlation framework within which the PBE generalized-gradient approximation is defined."}}, {"data": {"id": "e1446", "source": "10.1093/bioinformatics/btp324", "target": "10.1093/bioinformatics/bty191", "type": "enables", "label": "BWA demonstrated Burrows-Wheeler-transform indexing for fast read alignment, enabling minimap2's later emphasis on efficient large-scale nucleotide mapping."}}, {"data": {"id": "e1447", "source": "10.1093/bioinformatics/btp352", "target": "10.1093/bioinformatics/bty191", "type": "enables", "label": "SAM/BAM gave minimap2 a standard alignment output and tooling ecosystem for representing and downstream-processing nucleotide mappings."}}, {"data": {"id": "e1448", "source": "10.1093/nar/25.17.3389", "target": "10.1093/bioinformatics/bty191", "type": "enables", "label": "Gapped BLAST and PSI-BLAST established seed-and-extend alignment with gapped extension, a search paradigm minimap2 builds on for pairwise sequence alignment."}}, {"data": {"id": "e1449", "source": "10.1038/ng.806", "target": "10.1093/bioinformatics/bty191", "type": "enables", "label": "The GATK framework defined variant-discovery workflows that depend on accurate read alignments, motivating minimap2's practical role in sequencing pipelines."}}, {"data": {"id": "e1450", "source": "10.2307/2089062", "target": "10.1037/h0077714", "type": "enables", "label": "Heider's analysis of interpersonal evaluation and affective balance helped motivate Russell's circumplex model by treating affect as structured along interpretable relational dimensions."}}, {"data": {"id": "e1451", "source": "10.1214/aos/1013203451", "target": "10.1145/2939672.2939785", "type": "enables", "label": "Friedman's gradient boosting machine supplied the additive tree-boosting optimization framework that XGBoost engineered into a scalable regularized system."}}, {"data": {"id": "e1452", "source": "10.1023/a:1010933404324", "target": "10.1145/2939672.2939785", "type": "enables", "label": "Random Forests popularized ensemble decision trees, enabling XGBoost to position boosted trees as a competing high-performance ensemble method."}}, {"data": {"id": "e1453", "source": "10.5555/1953048.2078195", "target": "10.1145/2939672.2939785", "type": "enables", "label": "Scikit-learn established Python machine-learning API conventions that XGBoost followed with estimator-style interfaces for broad adoption."}}, {"data": {"id": "e1454", "source": "10.1038/318162a0", "target": "10.1038/354056a0", "type": "enables", "label": "The discovery of C60 showed stable curved graphitic carbon cages, enabling Iijima's interpretation of helical microtubules as related fullerene-like carbon nanostructures."}}, {"data": {"id": "e1455", "source": "10.1038/nature00766", "target": "10.1056/nejmoa1103782", "type": "enables", "label": "The identification of oncogenic BRAF mutations in melanoma enabled vemurafenib trials by defining BRAF V600E as a targetable driver mutation."}}, {"data": {"id": "e1456", "source": "10.1056/nejmoa1003466", "target": "10.1056/nejmoa1501824", "type": "enables", "label": "Ipilimumab's survival benefit validated immune checkpoint blockade in metastatic melanoma, enabling pembrolizumab's PD-1 blockade strategy to be tested in lung cancer."}}, {"data": {"id": "e1457", "source": "10.1016/0022-2836(77)90052-3", "target": "10.1126/science.2523562", "type": "enables", "label": "Nick translation enabled high-specific-activity DNA probes, which were essential for screening cDNA clones from the non-A, non-B hepatitis viral genome."}}, {"data": {"id": "e1458", "source": "10.1021/bi00591a005", "target": "10.1126/science.2523562", "type": "enables", "label": "Chirgwin's guanidinium-based RNA isolation method enabled recovery of intact viral RNA needed to synthesize and clone the hepatitis C cDNA genome."}}, {"data": {"id": "e1459", "source": "10.1016/s0022-2836(75)80083-0", "target": "10.1126/science.2523562", "type": "enables", "label": "Southern blotting enabled detection of specific nucleic acid sequences, providing the hybridization logic used to identify hepatitis C cDNA clones."}}, {"data": {"id": "e1460", "source": "10.1214/aoms/1177730491", "target": "10.1080/01621459.1952.10483441", "type": "enables", "label": "Mann and Whitney's stochastic dominance rank test supplied the two-sample rank-statistic logic that Kruskal and Wallis generalized to one-way rank analysis of variance."}}, {"data": {"id": "e1461", "source": "10.2307/3001968", "target": "10.1080/01621459.1952.10483441", "type": "enables", "label": "Wilcoxon's ranked pairwise comparison method established rank-based nonparametric testing that Kruskal and Wallis extended from two groups to one-criterion multi-group variance analysis."}}, {"data": {"id": "e1462", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/cvpr52688.2022.01042", "type": "enables", "label": "ImageNet provided the large labeled visual corpus and benchmark culture that made high-capacity image generators such as latent diffusion models trainable and comparable."}}, {"data": {"id": "e1463", "source": "10.1037/0003-066x.37.2.122", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Bandura's self-efficacy mechanism is one of the agency constructs whose cultural variability motivates the WEIRD critique of psychology's subject populations."}}, {"data": {"id": "e1464", "source": "10.2307/4134391", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Hofstede's cross-national value dimensions supplied comparative evidence that cultural differences are systematic rather than noise, a premise central to the WEIRD argument."}}, {"data": {"id": "e1465", "source": "10.1037/0033-295x.98.2.224", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Markus and Kitayama's independent-versus-interdependent self-construals provided a concrete psychological mechanism for the cultural differences highlighted by the WEIRD critique."}}, {"data": {"id": "e1466", "source": "10.1103/physrevlett.13.508", "target": "10.1016/j.physletb.2012.08.021", "type": "enables", "label": "Higgs's broken-symmetry mechanism predicted a massive scalar boson, giving CMS the theoretical target identified in the 125 GeV discovery."}}, {"data": {"id": "e1467", "source": "10.1103/physrevlett.13.321", "target": "10.1016/j.physletb.2012.08.021", "type": "enables", "label": "Englert and Brout's gauge-symmetry breaking mechanism explained how vector bosons acquire mass, forming part of the Higgs-sector theory tested by CMS."}}, {"data": {"id": "e1468", "source": "10.1103/physrevlett.19.1264", "target": "10.1016/j.physletb.2012.08.021", "type": "enables", "label": "Weinberg's electroweak lepton model embedded spontaneous symmetry breaking in the Standard Model, making the Higgs boson a specific experimental prediction for CMS."}}, {"data": {"id": "e1469", "source": "10.1038/323533a0", "target": "10.1214/aos/1013203451", "type": "enables", "label": "Back-propagation popularized gradient-based optimization of model parameters, the same gradient-descent principle Friedman used to fit additive models in function space."}}, {"data": {"id": "e1470", "source": "10.2307/2288003", "target": "10.1214/aos/1013203451", "type": "enables", "label": "CART supplied regression trees as weak learners, which Friedman's gradient boosting machine combined sequentially to minimize loss functions."}}, {"data": {"id": "e1471", "source": "10.1037/h0077714", "target": "10.1037/0033-295x.98.2.224", "type": "enables", "label": "Russell's valence-arousal circumplex framed affect as structured psychological dimensions, supporting later claims that self-construal shapes emotion and motivation."}}, {"data": {"id": "e1472", "source": "10.1056/nejm199512143332401", "target": "10.1056/nejmoa1414905", "type": "enables", "label": "The tPA trial established rapid reperfusion as effective acute stroke treatment, enabling later trials to test endovascular thrombectomy as an additional reperfusion method."}}, {"data": {"id": "e1473", "source": "10.1021/ja01145a126", "target": "10.1038/359710a0", "type": "enables", "label": "Barrett-Joyner-Halenda pore-size analysis made nitrogen isotherms a standard way to characterize mesoporosity, which was essential for validating liquid-crystal-templated molecular sieves."}}, {"data": {"id": "e1474", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/iccv.2017.74", "type": "enables", "label": "ImageNet-trained convolutional networks provided the deep visual classifiers whose class-discriminative regions Grad-CAM localizes with gradients."}}, {"data": {"id": "e1475", "source": "10.1002/(sici)1097-4571(199009)41:6<391::aid-asi1>3.0.co;2-9", "target": "10.1162/tacl_a_00051", "type": "enables", "label": "Latent semantic analysis established dense vector representations of word meaning, a foundation later extended by fastText with character subword information."}}, {"data": {"id": "e1476", "source": "10.1111/j.1468-0335.1937.tb00002.x", "target": "10.1002/(sici)1097-0266(199708)18:7<509::aid-smj882>3.0.co;2-z", "type": "enables", "label": "Coase's theory of firm boundaries framed firms as governance structures, a basis for dynamic capabilities' account of how firms organize and reconfigure activities."}}, {"data": {"id": "e1477", "source": "10.2307/2232409", "target": "10.1002/(sici)1097-0266(199708)18:7<509::aid-smj882>3.0.co;2-z", "type": "enables", "label": "Nelson and Winter's routines-based evolutionary theory supplied the organizational-learning mechanism that dynamic capabilities recast as deliberate reconfiguration under change."}}, {"data": {"id": "e1478", "source": "10.1002/smj.4250050207", "target": "10.1002/(sici)1097-0266(199708)18:7<509::aid-smj882>3.0.co;2-z", "type": "enables", "label": "Wernerfelt's resource-based view made firm-specific resources central to advantage, which dynamic capabilities extended to the renewal and recombination of those resources."}}, {"data": {"id": "e1479", "source": "10.1086/260866", "target": "10.1002/(sici)1097-0266(199708)18:7<509::aid-smj882>3.0.co;2-z", "type": "enables", "label": "Jensen and Meckling's agency theory highlighted control and incentive problems inside firms, a governance backdrop for dynamic capabilities' emphasis on managerial coordination."}}, {"data": {"id": "e1480", "source": "10.1073/pnas.95.25.14863", "target": "10.1038/nmeth.2688", "type": "enables", "label": "Hierarchical clustering and heatmap visualization of genome-wide expression data enabled later epigenomic assays like ATAC-seq to interpret genome-wide chromatin accessibility patterns as coordinated regulatory programs."}}, {"data": {"id": "e1481", "source": "10.1016/s0021-9258(19)52451-6", "target": "10.1016/s0021-9258(20)82244-3", "type": "enables", "label": "The Lowry Folin phenol protein assay enabled Omura and Sato to quantify microsomal protein fractions while characterizing the carbon-monoxide-binding cytochrome P450 pigment."}}, {"data": {"id": "e1482", "source": "10.1093/bioinformatics/btp324", "target": "10.1016/j.cell.2014.11.021", "type": "enables", "label": "BWA enabled kilobase-resolution Hi-C by accurately aligning the massive short-read contact libraries used to infer chromatin loops."}}, {"data": {"id": "e1483", "source": "10.1016/0304-405x(76)90026-x", "target": "10.1111/0022-1082.00115", "type": "enables", "label": "Agency-cost theory supplied the ownership-control framework that La Porta and colleagues used to compare corporate ownership structures across countries."}}, {"data": {"id": "e1484", "source": "10.1037/h0054651", "target": "10.1006/cogp.1999.0734", "type": "enables", "label": "The Stroop interference task provided a concrete measure of inhibitory control used in latent-variable models of executive functions."}}, {"data": {"id": "e1485", "source": "10.1103/physrevlett.45.566", "target": "10.1063/1.464304", "type": "enables", "label": "Quantum Monte Carlo benchmark energies for the electron gas helped calibrate exchange-correlation approximations used in hybrid density-functional methods."}}, {"data": {"id": "e1486", "source": "10.1103/physreva.38.3098", "target": "10.1063/1.464304", "type": "enables", "label": "Becke's asymptotically corrected exchange functional supplied the gradient-corrected exchange component incorporated into B3LYP-style hybrid functionals."}}, {"data": {"id": "e1487", "source": "10.1103/physrev.140.a1133", "target": "10.1063/1.464304", "type": "enables", "label": "Kohn-Sham self-consistent density-functional equations provided the formal framework in which hybrid Hartree-Fock and local density-functional exchange could be mixed."}}, {"data": {"id": "e1488", "source": "10.1016/s0019-9958(65)90241-x", "target": "10.1007/bf01001956", "type": "enables", "label": "Fuzzy set theory established graded membership as a model of vagueness that rough set theory contrasted with lower and upper approximations from indiscernibility relations."}}, {"data": {"id": "e1489", "source": "10.1126/science.1102896", "target": "10.1002/adma.201102306", "type": "enables", "label": "Graphene's isolation by exfoliation demonstrated that stable atomically thin crystals could be produced, motivating exfoliation of layered MAX phases into two-dimensional MXenes."}}, {"data": {"id": "e1490", "source": "10.1056/nejmoa1211721", "target": "10.1016/j.cell.2020.02.058", "type": "enables", "label": "The identification of MERS-CoV established coronavirus spike-mediated entry and antigenicity as a key comparative framework for structural studies of SARS-CoV-2 spike."}}, {"data": {"id": "e1491", "source": "10.1093/bioinformatics/btp352", "target": "10.1038/s41586-020-2008-3", "type": "enables", "label": "SAM/BAM and SAMtools enabled standardized mapping, sorting, and analysis of sequencing reads used to assemble and characterize the novel coronavirus genome."}}, {"data": {"id": "e1492", "source": "10.1038/75556", "target": "10.1038/nature14248", "type": "enables", "label": "Gene Ontology supplied standardized functional annotations used to interpret regulatory elements and tissue-specific epigenomic states across reference epigenomes."}}, {"data": {"id": "e1493", "source": "10.1093/bioinformatics/btp324", "target": "10.1038/nature14248", "type": "enables", "label": "BWA enabled the reference epigenome project by aligning large ChIP-seq, DNA methylation, and chromatin-accessibility short-read datasets to the human genome."}}, {"data": {"id": "e1494", "source": "10.1038/nmeth.1226", "target": "10.1038/nature14248", "type": "enables", "label": "RNA-seq transcriptome quantification enabled the reference epigenome analysis to connect chromatin states with gene expression across human tissues and cell types."}}, {"data": {"id": "e1495", "source": "10.2307/2092245", "target": "10.2307/412243", "type": "enables", "label": "Ethnomethodology's analysis of everyday social order enabled Sacks, Schegloff, and Jefferson to formalize turn-taking as an interactional system."}}, {"data": {"id": "e1496" from local to nonlocal operators."}}, {"data": {"id": "e1503", "source": "10.1016/0022-3956(75)90026-6", "target": "10.1093/gerona/56.3.m146", "type": "enables", "label": "The Mini-Mental State Examination provided a standardized cognitive-screening measure used to distinguish frailty from cognitive impairment in older adults."}}, {"data": {"id": "e1504", "source": "10.1086/307221", "target": "10.1051/0004-6361/201833910", "type": "enables", "label": "High-redshift supernova measurements established observational evidence for \u03a9\u039b-dominated accelerated expansion that Planck later constrained precisely with CMB data."}}, {"data": {"id": "e1505", "source": "10.1086/300499", "target": "10.1051/0004-6361/201833910", "type": "enables", "label": "The accelerating-universe supernova evidence motivated the \u039bCDM cosmological model whose parameters Planck 2018 estimates with high precision."}}, {"data": {"id": "e1506", "source": "10.1051/0004-6361/201321591", "target": "10.1051/0004-6361/201833910", "type": "enables", "label": "Planck 2013 established the satellite's CMB parameter-estimation pipeline and \u039bCDM baseline that Planck 2018 refined with final data."}}, {"data": {"id": "e1507", "source": "10.1086/260061", "target": "10.1111/j.1540-6261.1993.tb04702.x", "type": "enables", "label": "Fama and MacBeth's empirical asset-pricing tests provided the regression framework used to assess whether momentum profits are risk compensation."}}, {"data": {"id": "e1508", "source": "10.2307/1913610", "target": "10.1111/j.1540-6261.1993.tb04702.x", "type": "enables", "label": "Newey-West HAC covariance estimation enabled robust inference for overlapping-horizon momentum returns in Jegadeesh and Titman's tests."}}, {"data": {"id": "e1509", "source": "10.1111/j.1540-6261.1964.tb02865.x", "target": "10.1016/0304-405x(93)90023-5", "type": "enables", "label": "Sharpe's CAPM supplied the single-market-factor benchmark that Fama and French challenged with additional stock and 245", "target": "10.1126/science.1259855", "type": "enables", "label": "Holling's resilience concept underpins the planetary-boundaries claim that Earth systems have thresholds beyond which stability can be lost."}}, {"data": {"id": "e1518", "source": "10.1038/461472a", "target": "10.1126/science.1259855", "type": "enables", "label": "The safe-operating-space framework introduced quantitative planetary boundaries that the 2015 paper updated and operationalized for human development."}}, {"data": {"id": "e1519", "source": "10.1126/science.7466396", "target": "10.1038/30918", "type": "enables", "label": "Axelrod's cooperation models helped motivate network-based studies of how local interactions can produce collective dynamics in connected populations."}}, {"data": {"id": "e1520", "source": "10.1016/0022-2836(70)90057-4", "target": "10.1126/science.aan6733", "type": "enables", "label": "Needleman-Wunsch sequence alignment enabled later detection of mutation-derived neoantigens whose mismatch-repair-deficient tumors respond to PD-1 blockade."}}, {"data": {"id": "e1521", "source": "10.1073/pnas.0502848102", "target": "10.1038/nature12385", "type": "enables", "label": "Isolation of atomically thin crystals, especially graphene, enabled stacking of two-dimensional layers into van der Waals heterostructures."}}, {"data": {"id": "e1522", "source": "10.1126/science.282.5391.1145", "target": "10.1126/science.1151526", "type": "enables", "label": "Human embryonic stem-cell pluripotency provided the benchmark phenotype that induced pluripotent stem cells sought to recreate from somatic cells."}}, {"data": {"id": "e1523", "source": "10.1002/jcc.540040211", "target": "10.1063/1.464397", "type": "enables", "label": "CHARMM molecular dynamics created the large biomolecular simulation setting where particle-mesh Ewald made long-range electrostatics computationally practical."}}, {"data": {"id": "e1524", "source": "10.1073/pnas.74.12.5463", "target": "10.1016/0092-8674(93)90585-e", "type": "enables", "label": "Sanger chain-termination sequencing enabled identification of the expanded CAG trinucleotide repeat in the Huntington disease gene."}}, {"data": {"id": "e1525", "source": "10.1037/0033-2909.98.2.310", "target": "10.1037/0033-2909.117.3.497", "type": "enables", "label": "The buffering hypothesis linked social support to stress protection, feeding the claim that interpersonal attachment is a basic human need."}}, {"data": {"id": "e1526", "source": "10.1126/science.7466396", "target": "10.1037/0033-2909.117.3.497", "type": "enables", "label": "Axelrod's cooperation model supplied an evolutionary account of stable social bonds that supports the need-to-belong thesis."}}, {"data": {"id": "e1527", "source": "10.1016/0022-3999(67)90010-4", "target": "10.1037/0033-2909.117.3.497", "type": "enables", "label": "The social readjustment scale quantified life stressors, giving later belongingness theory evidence that social disruption has broad psychological costs."}}, {"data": {"id": "e1528", "source": "10.1109/cvpr.2009.5206848", "target": "10.1145/3065386", "type": "enables", "label": "The ImageNet dataset and benchmark enabled training and evaluating the deep convolutional network that won large-scale image classification."}}, {"data": {"id": "e1529", "source": "10.1023/a:1010933404324", "target": "10.1145/3065386", "type": "enables", "label": "Random Forests provided a strong pre-deep-learning ensemble baseline that contextualized the performance gains of convolutional neural networks on ImageNet."}}, {"data": {"id": "e1530", "source": "10.1086/307221", "target": "10.1088/0067-0049/192/2/18", "type": "enables", "label": "High-redshift supernova measurements of Omega and Lambda supplied external evidence for dark energy used in WMAP cosmological-parameter interpretation."}}, {"data": {"id": "e1531", "source": "10.1086/300499", "target": "10.1088/0067-0049/192/2/18", "type": "enables", "label": "Supernova evidence for cosmic acceleration supported the Lambda-CDM model whose parameters WMAP later constrained with microwave-background data."}}, {"data": {"id": "e1532", "source": "10.1086/377226", "target": "10.1088/0067-0049/192/2/18", "type": "enables", "label": "The first-year WMAP parameter framework enabled the seven-year WMAP analysis through improved cosmic microwave background constraints."}}, {"data": {"id": "e1533", "source": "10.1103/physrevd.23.347", "target": "10.1088/0067-0049/192/2/18", "type": "enables", "label": "Inflation predicted nearly flat geometry and primordial fluctuations that WMAP tested through its cosmological interpretation."}}, {"data": {"id": "e1534", "source": "10.1016/s0022-2836(05)80360-2", "target": "10.1371/journal.pcbi.1002195", "type": "enables", "label": "BLAST established fast heuristic sequence database search, a computational goal later extended to profile HMM searches in HMMER3."}}, {"data": {"id": "e1535", "source": "10.1016/0022-2836(81)90087-5", "target": "10.1371/journal.pcbi.1002195", "type": "enables", "label": "Smith-Waterman local alignment defined the optimal subsequence-matching problem that profile HMM search tools approximate at scale."}}, {"data": {"id": "e1536", "source": "10.1093/nar/25.17.3389", "target": "10.1371/journal.pcbi.1002195", "type": "enables", "label": "PSI-BLAST popularized iterative profile-based homology detection, directly motivating faster profile HMM search methods."}}, {"data": {"id": "e1537", "source": "10.1090/qam/10666", "target": "10.1137/0111030", "type": "enables", "label": "Levenberg's damped least-squares method supplied the core nonlinear-optimization idea refined by Marquardt's algorithm."}}, {"data": {"id": "e1538", "source": "10.1088/0004-6256/140/6/1868", "target": "10.1051/0004-6361/201833051", "type": "enables", "label": "WISE infrared all-sky photometry complemented Gaia astrometry for cross-matched source characterization in Gaia Data Release 2."}}, {"data": {"id": "e1539", "source": "10.1086/498708", "target": "10.1051/0004-6361/201833051", "type": "enables", "label": "2MASS near-infrared all-sky catalog data complemented Gaia astrometry for cross-matching and stellar-source characterization in Gaia Data Release 2."}}]};
const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [].concat(data.nodes, data.edges),
  style: [
    { selector: "node", style: {
        "background-color": "#5b8def", "label": "data(label)", "color": "#cdd6e4",

      }},
    { selector: "edge[type='cite']", style: { "line-color":"#7e8aa1" }},
