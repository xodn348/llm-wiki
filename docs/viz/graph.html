ship."}}, {"data": {"id": "e1129", "source": "10.1126/science.290.5500.2319", "target": "10.1145/2939672.2939754", "type": "enables", "label": "Isomap linked manifold structure to low-dimensional embeddings via graph geodesics, enabling node2vec's use of graph neighborhoods for representation learning."}}, {"data": {"id": "e1130", "source": "10.1126/science.290.5500.2323", "target": "10.1145/2939672.2939754", "type": "enables", "label": "Locally Linear Embedding showed that local neighborhood structure can define global representations, enabling node2vec's neighborhood-preserving graph embeddings."}}, {"data": {"id": "e1131", "source": "10.1093/nar/7.6.1513", "target": "10.1128/jb.173.2.697-703.1991", "type": "enables", "label": "Rapid alkaline plasmid extraction enabled routine preparation of recombinant DNA templates used in PCR-based 16S rDNA amplification workflows."}}, {"data": {"id": "e1132", "source": "10.1056/nejm199309303291401", "target": "10.1016/s0140-6736(98)07019-6", "type": "enables", "label": "The DCCT established intensive glycemic control as a complication-reducing intervention, enabling UKPDS to test the same clinical claim in type 2 diabetes."}}, {"data": {"id": "e1133", "source": "10.1093/genetics/155.2.945", "target": "10.1086/519795", "type": "enables", "label": "STRUCTURE's multilocus genotype framework for population stratification enabled PLINK's population-based association analysis tools and stratification-aware workflows."}}, {"data": {"id": "e1134", "source": "10.1111/j.2517-6161.1995.tb02031.x", "target": "10.1086/519795", "type": "enables", "label": "Benjamini-Hochberg false discovery rate control enabled PLINK to support genome-wide multiple-testing correction for large association scans."}}, {"data": {"id": "e1135", "source": "10.1016/s0019-9958(65)90241-x", "target": "10.1016/0020-0255(75)90036-5", "type": "enables", "label": "Zadeh's fuzzy sets provided graded membership, enabling linguistic variables to formalize approximate reasoning with terms like high, low, and very."}}, {"data": {"id": "e1136", "source": "10.1111/j.1469-1809.1936.tb02137.x", "target": "10.1109/icnn.1995.488968", "type": "enables", "label": "Fisher's discriminant analysis introduced optimization over multivariate measurements, enabling later population-based search methods such as particle swarm optimization."}}, {"data": {"id": "e1137", "source": "10.1016/0022-3956(75)90026-6", "target": "10.1212/wnl.34.7.939", "type": "enables", "label": "The Mini-Mental State Examination supplied a standardized cognitive screening measure, enabling Alzheimer's diagnostic criteria to operationalize dementia assessment."}}, {"data": {"id": "e1138", "source": "10.1002/(sici)1097-4571(199009)41:6<391::aid-asi1>3.0.co;2-9", "target": "10.1162/tacl_a_00051", "type": "enables", "label": "Latent semantic analysis represented words through distributional vector spaces, enabling subword-enriched word vectors to refine lexical embeddings."}}, {"data": {"id": "e1139", "source": "10.1109/tpami.1984.4767596", "target": "10.1145/2623330.2623732", "type": "enables", "label": "Gibbs sampling for probabilistic image restoration enabled DeepWalk's random-walk-based sampling view of graph neighborhoods for representation learning."}}, {"data": {"id": "e1140", "source": "10.1073/pnas.0601602103", "target": "10.1145/2623330.2623732", "type": "enables", "label": "Newman's modularity objective framed random-walk locality as community structure, a graph property DeepWalk exploits by treating truncated random walks as node contexts."}}, {"data": {"id": "e1141", "source": "10.2307/2530946", "target": "10.1021/ci100050t", "type": "enables", "label": "CART popularized tree-based decision rules, the kind of interpretable branching structure later used to reason about molecular substructures encoded by extended-connectivity fingerprints."}}, {"data": {"id": "e1142", "source": "10.1080/01621459.1979.10482531", "target": "10.1016/0165-1889(88)90041-3", "type": "enab  "10.1126/science.1127647", "target": "10.1038/nature14236", "type": "enables", "label": "Deep autoencoder work helped establish multilayer neural representations that made deep learning practical for later deep reinforcement learning systems."}}, {"data": {"id": "e1170", "source": "10.1109/5.726791", "target": "10.1038/nature14236", "type": "enables", "label": "LeNet's convolutional feature learning provided the visual representation method that DQN used to process Atari screen pixels."}}, {"data": {"id": "e1171", "source": "10.2307/3033543", "target": "10.1137/s003614450342480", "type": "enables", "label": "Betweenness centrality became one of the graph measures surveyed as a core tool for analyzing complex network structure and function."}}, {"data": {"id": "e1172", "source": "10.1016/s0169-7552(98)00110-x", "target": "10.1137/s003614450342480", "type": "enables", "label": "PageRank and Web hyperlink analysis supplied a large-scale directed-network example for complex network theory."}}, {"data": {"id": "e1173", "source": "10.1038/30918", "target": "10.1137/s003614450342480", "type": "enables", "label": "The small-world network model became a central generative pattern in Newman's synthesis of complex network structure."}}, {"data": {"id": "e1174", "source": "10.1109/tit.1976.1055638", "target": "10.1145/357980.358017", "type": "enables", "label": "Diffie and Hellman's public-key cryptography concept enabled RSA's concrete digital-signature and public-key encryption method."}}, {"data": {"id": "e1175", "source": "10.1016/0304-405x(77)90015-0", "target": "10.1016/0304-405x(84)90023-0", "type": "enables", "label": "Static tradeoff ideas about debt determinants framed the capital-structure benchmark that Myers and Majluf contrasted with information-driven financing choices."}}, {"data": {"id": "e1176", "source": "10.2307/1879431", "target": "10.1016/0304-405x(84)90023-0", "type": "enables", "label": "Akerlof's adverse selection mechanism under asymmetric information 03/physrevlett.45.566", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "The 1980 stochastic electron-gas calculations helped quantify exchange-correlation behavior used in density-functional approximations that PAW calculations rely on."}}, {"data": {"id": "e1184", "source": "10.1103/physrevlett.55.2471", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "The 1985 Car-Parrinello unification of molecular dynamics with density-functional theory created the first-principles simulation setting in which the PAW method became useful."}}, {"data": {"id": "e1185", "source": "10.1016/0021-9991(77)90098-5", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "The 1977 constraint-integration algorithm enabled stable constrained molecular dynamics, a simulation technique later combined with PAW electronic-structure forces."}}, {"data": {"id": "e1186", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevb.50.17953", "type": "enables", "label": "The 1965 Kohn-Sham equations supplied the density-functional framework whose all-electron reconstruction problem the PAW method addresses."}}, {"data": {"id": "e1187", "source": "10.1016/0749-5978(91)90020-t", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "The theory of planned behavior contributed the attitudes, norms, perceived control, and intention constructs that CFIR incorporates as implementation-relevant determinants."}}, {"data": {"id": "e1188", "source": "10.1037//0033-295x.84.2.191", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy construct underlies CFIR's emphasis on individual confidence and capability as determinants of implementation behavior."}}, {"data": {"id": "e1189", "source": "10.1016/0146-6402(78)90002-4", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy theory supplies the belief-in-capability mechanism that CFIR uses to explain individual-level implementation readiness."}}, {"data": {"id": "e1190", "source": "10.1037/0033-295x.84.2.191", "target": "10.1186/1748-5908-4-50", "type": "enables", "label": "Bandura's self-efficacy construct links to CFIR through the claim that confidence in performing a behavior affects whether evidence-based practices are adopted."}}, {"data": {"id": "e1191", "source": "10.1016/s0021-9258(19)52451-6", "target": "10.1016/s0021-9258(20)82244-3", "type": "enables", "label": "The Lowry Folin phenol assay enabled protein quantification needed to characterize cytochrome P-450 as the carbon monoxide-binding pigment of liver microsomes."}}, {"data": {"id": "e1192", "source": "10.1037/h0092976", "target": "10.1037/0022-3514.57.6.1069", "type": "enables", "label": "Rotter's internal-versus-external locus of control construct informed Ryff's psychological well-being dimension of environmental mastery and agency."}}, {"data": {"id": "e1193", "source": "10.1037/h0046016", "target": "10.1037//0022-3514.51.6.1173", "type": "enables", "label": "The multitrait-multimethod framework established discriminant validity logic that Baron and Kenny applied to distinguish moderator and mediator variables."}}, {"data": {"id": "e1194", "source": "10.1056/nejmoa0708857", "target": "10.1056/nejmoa1915745", "type": "enables", "label": "The sorafenib trial established systemic therapy as a survival-improving standard in advanced hepatocellular carcinoma, giving the atezolizumab-bevacizumab trial its benchmark comparator."}}, {"data": {"id": "e1195", "source": "10.1109/cvpr.2009.5206848", "target": "10.1145/3065386", "type": "enables", "label": "ImageNet provided the large labeled visual dataset and classification benchmark on which the deep convolutional neural network achieved its breakthrough result."}}, {"data": {"id": "e1196", "source": "10.1023/a:1010933404324", "target": "10.1145/3065386", "type": "enables", "label": "Random Forests provided a strong pre-deep-learning ensemble baseline for image classification, helping frame the performance gains of convolutional neural networks on ImageNet."}}, {"data": {"id": "e1197", "source": "10.1056/nejmoa1003466", "target": "10.1056/nejmoa1606774", "type": "enables", "label": "The ipilimumab trial proved that immune checkpoint blockade can improve survival in metastatic cancer, supporting later PD-1 blockade testing with pembrolizumab in lung cancer."}}, {"data": {"id": "e1198", "source": "10.1056/nejmoa1103782", "target": "10.1056/nejmoa1606774", "type": "enables", "label": "The vemurafenib trial established mutation-selected targeted therapy as a survival-improving oncology strategy, contrasting with and motivating biomarker-selected immunotherapy trials such as pembrolizumab in PD-L1-positive lung cancer."}}, {"data": {"id": "e1199", "source": "10.2307/3033543", "target": "10.1103/physreve.69.026113", "type": "enables", "label": "Freeman's betweenness centrality quantified bridge nodes in networks, a concept used by Girvan and Newman to remove high-betweenness edges when detecting communities."}}, {"data": {"id": "e1200", "source": "10.1038/30918", "target": "10.1103/physreve.69.026113", "type": "enables", "label": "Watts and Strogatz's small-world graph model helped frame network topology as a measurable structure, enabling Newman and Girvan's modularity-based detection of communities in complex networks."}}, {"data": {"id": "e1201", "source": "10.1111/j.2517-6161.1964.tb00553.x", "target": "10.1080/01621459.1999.10474144", "type": "enables", "label": "Box-Cox transformation theory enabled Fine and Gray to model transformed cumulative incidence functions while preserving proportional regression structure for competing risks."}}, {"data": {"id": "e1202", "source": "10.1111/j.2517-6161.1972.tb00899.x", "target": "10.1080/01621459.1999.10474144", "type": "enables", "label": "Cox's proportional hazards regression supplied the semiparametric hazard-model template that Fine and Gray adapted to the subdistribution hazard for competing risks."}}, {"data": {"id": "e1203", "source": "10.1086/300499", "target": "10.1086/377226", "type": "enables", "label": "The supernova evidence for cosmic acceleration made the cosmological constant a central parameter that WMAP then constrained using cosmic microwave background anisotropies."}}, {"data": {"id": "e1204", "source": "10.1038/318162a0", "target": "10.1038/354056a0", "type": "enables", "label": "The discovery of stable curved sp2 carbon cages in C60 motivated Iijima's interpretation of graphitic carbon microtubules as related closed carbon nanostructures."}}, {"data": {"id": "e1205", "source": "10.2307/2232409", "target": "10.2307/2393553", "type": "enables", "label": "Nelson and Winter's evolutionary view of firm routines and learning underpinned Cohen and Levinthal's claim that prior knowledge determines absorptive capacity."}}, {"data": {"id": "e1206", "source": "10.1126/science.284.5411.143", "target": "10.1016/j.cell.2006.06.044", "type": "enables", "label": "Pittenger et al. established adult mesenchymal stem cells as multilineage progenitors, enabling Engler et al. to test matrix stiffness as a physical cue for lineage specification."}}, {"data": {"id": "e1207", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/cvpr52688.2022.01042", "type": "enables", "label": "ImageNet provided the large-scale natural-image benchmark and pretrained recognition backbone ecosystem that latent diffusion models used for high-resolution image synthesis evaluation and conditioning."}}, {"data": {"id": "e1208", "source": "10.1162/neco.1997.9.8.1735", "target": "10.1109/tpami.2019.2913372", "type": "enables", "label": "LSTM introduced gated multiplicative control of information flow, a mechanism echoed by squeeze-and-excitation blocks that gate convolutional feature channels."}}, {"data": {"id": "e1209", "source": "10.1109/34.730558", "target": "10.1109/tpami.2019.2913372", "type": "enables", "label": "Itti, Koch, and Niebur's saliency model formalized attention as selective feature weighting, enabling the channel-attention idea used in squeeze-and-excitation networks."}}, {"data": {"id": "e1210", "source": "10.1111/j.2517-6161.1972.tb00899.x", "target": "10.1126/science.3798106", "type": "enables", "label": "Cox proportional hazards regression enabled Slamon et al. to quantify the association between HER-2/neu amplification and breast-cancer relapse and survival."}}, {"data": {"id": "e1211", "source": "10.1080/01621459.1958.10501452", "target": "10.1126/science.3798106", "type": "enables", "label": "Kaplan-Meier estimation enabled Slamon et al. to compare censored relapse-free and overall survival curves by HER-2/neu amplification status."}}, {"data": {"id": "e1212", "source": "10.1016/0022-2836(81)90087-5", "target": "10.1186/gb-2009-10-3-r25", "type": "enables", "label": "Smith-Waterman local alignment defined dynamic-programming sequence matching, which Bowtie replaced with FM-index search to align short reads much faster."}}, {"data": {"id": "e1213", "source": "10.1111/j.2517-6161.1974.tb00994.x", "target": "10.1184/r1/6586835.v1", "type": "enables", "label": "Stone's cross-validation principle enabled Clauset, Shalizi, and Newman to assess power-law fits by out-of-sample-style goodness-of-fit and model comparison rather than visual inspection alone."}}, {"data": {"id": "e1214", "source": "10.1037/0003-066x.37.2.122", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Bandura's self-efficacy mechanism informed Ajzen's perceived behavioral control construct in the theory of planned behavior."}}, {"data": {"id": "e1215", "source": "10.1037/h0092976", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Rotter's locus-of-control expectancy concept informed Ajzen's perceived behavioral control component in the theory of planned behavior."}}, {"data": {"id": "e1216", "source": "10.1007/bf02310555", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Cronbach's alpha supplied the internal-consistency reliability method used to validate multi-item attitude, norm, and control measures in planned-behavior research."}}, {"data": {"id": "e1217", "source": "10.1016/0146-6402(78)90002-4", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Bandura's unifying self-efficacy theory supplied the belief-in-capability construct that Ajzen incorporated as perceived behavioral control."}}, {"data": {"id": "e1218", "source": "10.1037/h0043158", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Miller's capacity limit for information processing supported Ajzen's use of compact expectancy-value belief sets to model attitudes, norms, and control."}}, {"data": {"id": "e1219", "source": "10.1037/0033-295x.84.2.191", "target": "10.1016/0749-5978(91)90020-t", "type": "enables", "label": "Bandura's 1977 self-efficacy theory directly shaped Ajzen's perceived behavioral control as a determinant of intentions and behavior."}}, {"data": {"id": "e1220", "source": "10.1109/tpami.1984.4767596", "target": "10.1109/34.56205", "type": "enables", "label": "Geman and Geman's Markov random-field energy minimization enabled anisotropic diffusion's edge-preserving smoothing view of images as evolving probabilistic spatial fields."}}, {"data": {"id": "e1221", "source": "10.1113/jphysiol.1962.sp006837", "target": "10.1152/jn.00338.2011", "type": "enables", "label": "Hubel and Wiesel's cortical maps of receptive-field organization enabled later functional-connectivity work to interpret correlated activity as evidence of large-scale cortical organization."}}, {"data": {"id": "e1222", "source": "10.1111/j.1558-5646.1984.tb05657.x", "target": "10.1093/genetics/131.2.479", "type": "enables", "label": "Weir and Cockerham's F-statistics provided the variance-partitioning framework that AMOVA extended from allele frequencies to molecular haplotype distances."}}, {"data": {"id": "e1223", "source": "10.2307/2408641", "target": "10.1093/genetics/131.2.479", "type": "enables", "label": "Weir and Cockerham's F-statistics provided the variance-partitioning framework that AMOVA extended from allele frequencies to molecular haplotype distances."}}, {"data": {"id": "e1224", "source": "10.1126/science.282.5391.1145", "target": "10.1186/gb-2013-14-10-r115", "type": "enables", "label": "Human embryonic stem-cell lines supplied a well-defined pluripotent cell type used to compare methylation age across human tissues and cell states."}}, {"data": {"id": "e1225", "source": "10.1038/353737a0", "target": "10.1126/science.1228604", "type": "enables", "label": "Dye-sensitized mesoporous TiO2 solar cells established the mesostructured oxide scaffold later reused for perovskite-sensitized hybrid solar cells."}}, {"data": {"id": "e1226", "source": "10.1126/science.270.5243.1789", "target": "10.1126/science.1228604", "type": "enables", "label": "Bulk donor-acceptor heterojunction photovoltaics enabled the hybrid-solar-cell concept of interpenetrating charge-separating networks in solution-processed devices."}}, {"data": {"id": "e1227", "source": "10.2307/1796430", "target": "10.1038/35002501", "type": "enables", "label": "Island biogeography's species-area and extinction-colonization logic enabled biodiversity hotspots to prioritize regions where habitat loss threatens concentrated endemic species."}}, {"data": {"id": "e1228", "source": "10.1109/cvpr.2009.5206848", "target": "10.18653/v1/d16-1264", "type": "enables", "label": "ImageNet's large-scale benchmark methodology enabled SQuAD's construction of a standardized, crowd-annotated dataset for measuring machine comprehension."}}, {"data": {"id": "e1229", "source": "10.1016/0022-2836(81)90087-5", "target": "10.1109/icassp.2015.7178964", "type": "enables", "label": "Common-subsequence dynamic programming enabled sequence-alignment style methods later used in speech recognition pipelines evaluated on LibriSpeech."}}, {"data": {"id": "e1230", "source": "10.1371/journal.pcbi.1002195", "target": "10.1038/s41586-021-03819-2", "type": "enables", "label": "Accelerated profile-HMM searches enabled AlphaFold's use of deep multiple-sequence alignments to extract evolutionary constraints for protein-structure prediction."}}, {"data": {"id": "e1231", "source": "10.1109/cvpr.2016.90", "target": "10.1038/s41586-021-03819-2", "type": "enables", "label": "Residual networks enabled AlphaFold's very deep neural architectures to propagate pairwise and spatial protein-structure features without optimization collapse."}}, {"data": {"id": "e1232", "source": "10.1109/34.868688", "target": "10.1007/s11263-013-0620-5", "type": "enables", "label": "Normalized cuts supplied graph-based image segmentation concepts that selective search adapted for hierarchical region grouping into object proposals."}}, {"data": {"id": "e1233", "source": "10.1023/b:visi.0000029664.99615.94", "target": "10.1007/s11263-013-0620-5", "type": "enables", "label": "SIFT's scale-invariant local feature representation informed selective search's use of robust visual cues for grouping candidate object regions."}}, {"data": {"id": "e1234", "source": "10.1109/cvpr.2005.177", "target": "10.1007/s11263-013-0620-5", "type": "enables", "label": "HOG showed that gradient-orientation histograms capture object shape, a cue selective search incorporated among complementary region descriptors."}}, {"data": {"id": "e1235", "source": "10.1109/tpami.2002.1017623", "target": "10.1007/s11263-013-0620-5", "type": "enables", "label": "Local binary patterns provided rotation-robust texture descriptors that selective search used as one of its region-similarity cues."}}, {"data": {"id": "e1236", "source": "10.1109/cvpr.2001.990517", "target": "10.1007/s11263-013-0620-5", "type": "enables", "label": "The boosted cascade detector established fast proposal-and-rejection object detection, motivating selective search's efficient generation of candidate object windows."}}, {"data": {"id": "e1237", "source": "1 2531595", "target": "10.1001/jama.2012.5669", "type": "enables", "label": "DeLong's nonparametric ROC AUC comparison enabled ARDS diagnostic studies to compare correlated prediction rules and biomarker classifiers."}}, {"data": {"id": "e1245", "source": "10.1037/0003-066x.37.2.122", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Bandura's self-efficacy construct supplied a psychological mechanism that Henrich et al. used to question whether Western subjects generalize globally."}}, {"data": {"id": "e1246", "source": "10.2307/4134391", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Hofstede's cross-national value dimensions supplied comparative cultural evidence for Henrich et al.'s claim that WEIRD samples are atypical."}}, {"data": {"id": "e1247", "source": "10.1037/0033-295x.98.2.224", "target": "10.1017/s0140525x0999152x", "type": "enables", "label": "Markus and Kitayama's independent-versus-interdependent self construals supplied a core example of culturally variable cognition in the WEIRD critique."}}, {"data": {"id": "e1248", "source": "10.1126/science.1102896", "target": "10.1002/adma.201102306", "type": "enables", "label": "Graphene's isolation by mechanical exfoliation established the atomically thin 2D-material paradigm that motivated exfoliated MXene nanocrystals."}}, {"data": {"id": "e1249", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/tpami.2015.2439281", "type": "enables", "label": "ImageNet-scale natural-image data enabled SRCNN to train and evaluate deep convolutional super-resolution on realistic image distributions."}}, {"data": {"id": "e1250", "source": "10.1109/5.726791", "target": "10.1109/tpami.2015.2439281", "type": "enables", "label": "LeNet's convolutional weight sharing and end-to-end gradient training provided the CNN template adapted by SRCNN for super-resolution."}}, {"data": {"id": "e1251", "source": "10.1109/tip.2003.819861", "target": "10.1109/tpami.2015.2439281", "type": "enables", "label": "SSIM provided the perceptual image-quality metric used to evaluate reconstruction fidelity in SRCNN super-resolution experiments."}}, {"data": {"id": "e1252", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/tpami.2015.2439281", "type": "enables", "label": "Backpropagation for convolutional handwritten-digit recognition demonstrated end-to-end learned image filters later reused in SRCNN-style vision networks."}}, {"data": {"id": "e1253", "source": "10.1086/307221", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "High-redshift supernova measurements constrained \u03a9 and \u039b, giving Planck 2013 an external benchmark for its CMB-derived cosmological parameters."}}, {"data": {"id": "e1254", "source": "10.1086/300499", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "The supernova evidence for cosmic acceleration established the \u039bCDM target model whose parameters Planck 2013 measured precisely from the CMB."}}, {"data": {"id": "e1255", "source": "10.1086/377226", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "WMAP's CMB parameter-estimation framework and \u039bCDM constraints provided the direct predecessor baseline for Planck 2013 cosmological parameters."}}, {"data": {"id": "e1256", "source": "10.1214/ss/1177011136", "target": "10.1051/0004-6361/201321591", "type": "enables", "label": "Gelman-Rubin multiple-chain convergence diagnostics enabled reliable MCMC posterior inference for Planck's cosmological parameter estimation."}}, {"data": {"id": "e1257", "source": "10.2307/2530946", "target": "10.1023/a:1018054314350", "type": "enables", "label": "CART supplied the high-variance decision-tree learners that bagging stabilized through bootstrap aggregation."}}, {"data": {"id": "e1258", "source": "10.1007/s11263-009-0275-4", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "PASCAL VOC provided the object-detection benchmark and evaluation protocol on which R-CNN demonstrated region-based CNN detection gains."}}, {"data": {"id": "e1259", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "ImageNet pretraining supplied the large-scale labeled visual representations that R-CNN fine-tuned for object detection and segmentation."}}, {"data": {"id": "e1260", "source": "10.1109/5.726791", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "LeCun et al. showed that convolutional networks can learn hierarchical visual features end-to-end, which R-CNN reused through a deep CNN feature extractor for object proposals."}}, {"data": {"id": "e1261", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "The zip-code recognition paper established backpropagation-trained convolutional filters for image recognition, a core mechanism behind the CNN features used in R-CNN."}}, {"data": {"id": "e1262", "source": "10.1023/b:visi.0000029664.99615.94", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "SIFT popularized scale-invariant local image descriptors, providing a hand-crafted feature baseline that R-CNN surpassed with learned convolutional region features."}}, {"data": {"id": "e1263", "source": "10.1109/cvpr.2005.177", "target": "10.1109/cvpr.2014.81", "type": "enables", "label": "HOG demonstrated that oriented-gradient descriptors are effective for object detection, setting the feature-engineering context that R-CNN replaced with learned CNN representations."}}, {"data": {"id": "e1264", "source": "10.1016/0010-0285(80)90005-5", "target": "10.1109/34.730558", "type": "enables", "label": "Feature-integration theory linked attention to basic visual feature maps, which Itti, Koch, and Niebur computationalized as saliency maps for rapid scene analysis."}}, {"data": {"id": "e1265", "source": "10.1038/323533a0", "target": "10.1145/2976749.2978318", "type": "enables", "label": "Backpropagation supplies the gradient computations th iants across tens of thousands of exomes."}}, {"data": {"id": "e1273", "source": "10.1111/j.1468-0335.1937.tb00002.x", "target": "10.1016/0304-405x(76)90026-x", "type": "enables", "label": "Coase's transaction-cost account of firms set up the contracting view that Jensen and Meckling formalized through agency costs and ownership structure."}}, {"data": {"id": "e1274", "source": "10.1111/j.1540-6261.1964.tb02865.x", "target": "10.1016/0304-405x(76)90026-x", "type": "enables", "label": "CAPM supplied the risk-and-return framework that Jensen and Meckling used to analyze incentives and ownership claims in the firm."}}, {"data": {"id": "e1275", "source": "10.2307/1884852", "target": "10.1016/0304-405x(76)90026-x", "type": "enables", "label": "Simon's bounded rationality motivated Jensen and Meckling's treatment of managers as self-interested agents whose behavior must be constrained by contracts."}}, {"data": {"id": "e1276", "source": "10.2307/2089062", "target": "10.1037/h0077714", "type": "enables", "label": "Heider's interpersonal psychology helped ground affect in relational evaluations, which Russell organized into the valence-arousal circumplex model."}}, {"data": {"id": "e1277", "source": "10.1093/bioinformatics/btp352", "target": "10.1038/s41586-020-2008-3", "type": "enables", "label": "SAMtools provided the standard read-alignment and variant-processing infrastructure used to assemble and analyze sequencing data from the new coronavirus."}}, {"data": {"id": "e1278", "source": "10.2307/2530946", "target": "10.1145/170035.170072", "type": "enables", "label": "CART established tree-based rule induction over tabular data, a precursor to association-rule mining's search for predictive itemset rules in transaction databases."}}, {"data": {"id": "e1279", "source": "10.1023/a:1022643204877", "target": "10.1145/170035.170072", "type": "enables", "label": "ID3 showed how to induce interpretable decision rules from data, which association-rule mining generalized to discov semble baseline and tree-splitting context for XGBoost."}}, {"data": {"id": "e1295", "source": "10.5555/1953048.2078195", "target": "10.1145/2939672.2939785", "type": "enables", "label": "Scikit-learn's Python machine-learning API conventions shaped XGBoost's accessible estimator interface and ecosystem integration."}}, {"data": {"id": "e1296", "source": "10.1145/130385.130401", "target": "10.1109/5.726791", "type": "enables", "label": "Optimal-margin classifiers influenced LeNet's comparison to margin-based supervised learning for document recognition."}}, {"data": {"id": "e1297", "source": "10.1007/bf02551274", "target": "10.1109/5.726791", "type": "enables", "label": "Universal approximation by sigmoidal networks justified multilayer neural networks as expressive function approximators for LeNet-style recognition."}}, {"data": {"id": "e1298", "source": "10.1113/jphysiol.1962.sp006837", "target": "10.1109/5.726791", "type": "enables", "label": "Hubel and Wiesel's visual-cortex receptive fields inspired convolutional networks' local receptive fields and hierarchical feature maps."}}, {"data": {"id": "e1299", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/5.726791", "type": "enables", "label": "Backpropagation for handwritten zip-code recognition directly preceded LeNet's gradient-trained convolutional architecture for document recognition."}}, {"data": {"id": "e1300", "source": "10.1109/tpami.2016.2577031", "target": "10.1109/iccv51070.2023.00371", "type": "enables", "label": "Faster R-CNN's region proposal framing enabled SAM's promptable segmentation pipeline by establishing object localization as a reusable precursor to mask prediction."}}, {"data": {"id": "e1301", "source": "10.1109/cvpr.2014.81", "target": "10.1109/iccv51070.2023.00371", "type": "enables", "label": "R-CNN linked CNN feature extraction with region-level recognition, enabling SAM's use of learned visual features for object-level segmentation masks."}}, {"data": {"id": "e1302", "source lation stratification enabled GTEx to adjust genotype-expression association tests for ancestry-related confounding."}}, {"data": {"id": "e1310", "source": "10.1086/519795", "target": "10.1126/science.1262110", "type": "enables", "label": "PLINK enabled GTEx's genome-wide genotype quality control and association testing infrastructure for eQTL analysis."}}, {"data": {"id": "e1311", "source": "10.1038/nature09534", "target": "10.1126/science.1262110", "type": "enables", "label": "The 1000 Genomes variation map enabled GTEx to use population-scale human variant references for genotype imputation and variant interpretation."}}, {"data": {"id": "e1312", "source": "10.1016/s0022-2836(05)80360-2", "target": "10.1126/science.1058040", "type": "enables", "label": "BLAST enabled rapid sequence similarity search, supporting annotation and validation of assembled regions in the Human Genome Project."}}, {"data": {"id": "e1313", "source": "10.1016/0022-2836(81)90087-5", "target": "10.1126/science.1058040", "type": "enables", "label": "Smith-Waterman local alignment enabled rigorous subsequence comparison, underpinning sequence assembly and annotation methods used for the human genome."}}, {"data": {"id": "e1314", "source": "10.1073/pnas.74.12.5463", "target": "10.1126/science.1058040", "type": "enables", "label": "Sanger chain-termination sequencing enabled the base-calling technology used to generate the Human Genome Project's reference sequence."}}, {"data": {"id": "e1315", "source": "10.2307/2343100", "target": "10.1016/0377-2217(78)90138-8", "type": "enables", "label": "Farrell's productive efficiency measure enabled data envelopment analysis by defining efficiency relative to an empirical production frontier."}}, {"data": {"id": "e1316", "source": "10.5281/zenodo.14579729", "target": "10.1509/jmkg.68.1.1.24036", "type": "enables", "label": "SERVQUAL's service-quality measurement enabled service-dominant logic by treating value as customer-perceived service performance rath ution and pooling for pattern extraction, which sentence CNNs adapted from images to word-sequence classification."}}, {"data": {"id": "e1331", "source": "10.1103/physrev.47.777", "target": "10.1103/physrevlett.70.1895", "type": "enables", "label": "The EPR paper introduced entanglement as a nonclassical correlation, which quantum teleportation uses together with classical communication to transfer an unknown state."}}, {"data": {"id": "e1332", "source": "10.1103/physrevb.33.8822", "target": "10.1103/physrevb.46.6671", "type": "enables", "label": "The 1986 correlation functional supplied the Perdew-Wang gradient-corrected correlation component used in later generalized gradient approximation applications."}}, {"data": {"id": "e1333", "source": "10.1103/physrev.140.a1133", "target": "10.1103/physrevb.46.6671", "type": "enables", "label": "The Kohn-Sham equations made practical density-functional calculations possible, enabling later GGA exchange-correlation functionals for atoms, molecules, solids, and surfaces."}}, {"data": {"id": "e1334", "source": "10.1088/0004-6256/140/6/1868", "target": "10.1051/0004-6361/201833051", "type": "enables", "label": "WISE infrared all-sky photometry provided external cross-match data used with Gaia DR2 to characterize sources across optical and infrared wavelengths."}}, {"data": {"id": "e1335", "source": "10.1086/498708", "target": "10.1051/0004-6361/201833051", "type": "enables", "label": "2MASS near-infrared all-sky photometry provided external catalog cross-matches that Gaia DR2 used for source validation and multi-band characterization."}}, {"data": {"id": "e1336", "source": "10.2307/1913610", "target": "10.1162/003355304772839588", "type": "enables", "label": "Newey-West HAC covariance estimation addressed serial correlation in standard errors, a problem central to Bertrand, Duflo, and Mullainathan's critique of difference-in-differences inference."}}, {"data": {"id": "e1337", "source": "10.1037/h0054346", "target": "10.1016/105 odels through the related belief that users can successfully perform computer-mediated tasks."}}, {"data": {"id": "e1429", "source": "10.1002/j.1538-7305.1948.tb01338.x", "target": "10.1103/physrev.106.620", "type": "enables", "label": "Shannon's entropy formalism gave Jaynes the information measure used to derive statistical mechanics by maximum entropy inference."}}, {"data": {"id": "e1430", "source": "10.1111/j.2517-6161.1977.tb01600.x", "target": "10.1038/44565", "type": "enables", "label": "The EM algorithm supplied the iterative latent-variable estimation template used in probabilistic interpretations and multiplicative updates for non-negative matrix factorization."}}, {"data": {"id": "e1431", "source": "10.1162/jocn.1991.3.1.71", "target": "10.1038/44565", "type": "enables", "label": "Eigenfaces showed that matrix factorization could learn compact face representations, while NMF replaced holistic PCA components with additive parts-based bases."}}, {"data": {"id": "e1432", "source": "10.1177/001872675400700202", "target": "10.1162/003355399556151", "type": "enables", "label": "Social comparison theory supplied the mechanism by which relative payoffs and peer outcomes shape fairness preferences in competition and cooperation."}}, {"data": {"id": "e1433", "source": "10.1007/s11263-009-0275-4", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "PASCAL VOC provided standard object-recognition benchmarks and evaluation practice that helped define downstream transfer tests for MoCo visual representations."}}, {"data": {"id": "e1434", "source": "10.1109/cvpr.2014.81", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "R-CNN demonstrated that deep convolutional features transfer effectively to detection, motivating MoCo to learn transferable visual representations without labels."}}, {"data": {"id": "e1435", "source": "10.1109/cvpr.2009.5206848", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "ImageNet supplied the large-scale visual dataset and supervised-pretraining benchmark that MoCo used as the central comparison point for self-supervised learning."}}, {"data": {"id": "e1436", "source": "10.1162/neco.1989.1.4.541", "target": "10.1109/cvpr42600.2020.00975", "type": "enables", "label": "Backpropagation for convolutional handwritten-recognition networks established end-to-end gradient training of visual feature extractors that modern contrastive encoders rely on."}}, {"data": {"id": "e1437", "source": "10.1126/science.282.5391.1145", "target": "10.1016/j.cell.2007.11.019", "type": "enables", "label": "Human embryonic stem-cell pluripotency provided the cellular benchmark that defined-factor reprogramming sought to reproduce in adult fibroblasts."}}]};
const cy = cytoscape({

    { selector: "node", style: {
        "background-color": "#5b8def", "label": "data(label)", "color": "#cdd6e4",

      }},
