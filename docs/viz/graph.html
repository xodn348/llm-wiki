093/genetics/155.2.945", "target": "10.1086/519795", "type": "enables", "label": "PLINK incorporates population-structure correction workflows motivated by STRUCTURE's multilocus inference of ancestry and admixture."}}, {"data": {"id": "e70", "source": "10.1111/j.2517-6161.1995.tb02031.x", "target": "10.1086/519795", "type": "enables", "label": "PLINK uses multiple-testing correction procedures, including false-discovery-rate control, to interpret genome-wide association scan results."}}]};
